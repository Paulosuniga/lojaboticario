{% extends "loja/base.html" %}
{% block title %}Cliente{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% if cliente %}Editar cliente{% else %}Novo cliente{% endif %}</h1>

<form method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-md-6">
        <label class="form-label">Nome</label>
        {{ form.nome }}
    </div>
    <div class="col-md-6">
        <label class="form-label">Telefone</label>
        {{ form.telefone }}
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'cliente_list' %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
